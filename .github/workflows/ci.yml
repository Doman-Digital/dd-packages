name: CI

# Runs on every push to main and every pull request, across all three
# packages. Before this repo existed, each package had its own copy of this
# file to maintain separately; one workspace-wide workflow replaces all three.

# PR-only. The push-to-main run re-tested the exact merge result the PR had
# already tested, and release.yml independently runs the full test + build
# before `npm publish`, so nothing shipped on the strength of that second run.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  # What npm will ship, checked as a consumer sees it: publint and attw on
  # each packed tarball, then require/import/bin/asset checks from a clean
  # install. See scripts/check-pack.mjs for why the matrix above cannot
  # catch this. One Node version: the tarball is the same on all of them.
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check packed tarballs
        run: pnpm run check:pack
