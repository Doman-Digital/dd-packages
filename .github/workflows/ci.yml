name: CI

# Runs on every pull request, across every package. Before this repo existed,
# each package had its own copy of this file to maintain separately; one
# workspace-wide workflow replaces them.

# PR-only. The push-to-main run re-tested the exact merge result the PR had
# already tested, and release.yml independently runs the full test + build
# before `npm publish`, so nothing shipped on the strength of that second run.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end of life on 2026-04-30 (nodejs/Release schedule).
        # Add 26.x once it becomes LTS on 2026-10-28.
        node-version: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # What npm will receive, not what the workspace links: pack every
      # package, lint the tarballs, install them into clean ESM and CommonJS
      # projects and load every export. One Node version is enough; the
      # tarball does not change with the runner.
      - name: Tarballs
        if: matrix.node-version == '22.x'
        run: pnpm run check:tarballs
