name: Release

# Versioning and publishing for all three packages, via Changesets. Each
# package versions independently (see .changeset/config.json) -- this one
# workflow replaces the three separate tag-triggered release.yml files the
# packages had before they shared a repo.
#
# On every push to main:
#   - If there are pending changesets, changesets/action opens or updates a
#     "Version Packages" PR that bumps the affected package(s) and updates
#     their CHANGELOG.md.
#   - Once that PR is merged (no pending changesets, but a package's
#     package.json version is ahead of what's published), it runs `pnpm run
#     release`, which builds and runs `changeset publish`. That publishes
#     only the packages that changed, tags each one `<name>@<version>`, and
#     pushes the tags.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored
# anywhere, GitHub mints a short-lived OIDC token scoped to this workflow
# run, and npm verifies it against each package's trusted-publisher config.
# That also produces a provenance attestation per package. Requires a public
# source repo -- provenance verification fails against a private one.
#
# Each package needs a trusted publisher on npmjs.com naming
# Doman-Digital/dd-packages + release.yml. THIS COMMENT DOES NOT RECORD
# WHETHER THAT IS DONE, and an earlier version of it did -- it said the setup
# was still outstanding, was read months later as current state, and was wrong.
# A comment cannot know what npm's config says.
#
# Check it, do not infer it:
#
#   npm trust list @domandigital/<package>     # prompts for 2FA
#
# A missing or wrong publisher fails at the registry with a 404/403 AFTER the
# build, which is how you tell it apart from the flag-parsing failure the npm
# pin below fixes.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # Trusted publishing needs npm >= 11.5.1, newer than the npm bundled with
      # the Node 22 runner image. Pinned to the 11.x major, NOT `npm@latest`.
      #
      # `npm@latest` floated to npm 12 and broke every publish from this repo
      # with `EUNKNOWNCONFIG Unknown cli flag: --git-checks`. The chain:
      # changesets detects pnpm and passes pnpm's `--no-git-checks`; pnpm 9.15.9
      # forwards that flag to npm when it delegates the publish; npm 11 silently
      # tolerated the unknown flag, npm 12 hard-errors on it. So the leak was
      # always there and an npm major bump turned it into a hard failure.
      #
      # Confirmed by running the real publish path in CI on both majors: npm
      # 12.0.2 dies on flag parsing, npm 11.19.1 reaches the registry.
      #
      # The upstream fix is @changesets/cli 3.x ("route package manager calls
      # through their respective CLIs during pnpm publish"), which needs pnpm
      # >= 10 and Node >= 22.11 -- the latter would drop the 20.x leg in ci.yml.
      # Do that deliberately, not as a side effect of a version float.
      - name: Use an npm that understands trusted publishing
        run: npm install -g "npm@^11.5.1"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
