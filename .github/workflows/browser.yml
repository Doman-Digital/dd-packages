name: Browser

# craft's and buyer-panel's rendered-page tests need a real Chromium. The main CI job has none,
# so those tests skip there, visibly. This job runs them, and only when the
# code they cover changes.
#
# No nightly schedule: ci-standards' policy gate rejects a cron that is not
# registered in its budget.yml with an owner and justification. Register one
# there first if a nightly backstop is wanted.
#
# It runs inside Playwright's own image, which carries the browsers and the
# Linux libraries they need. Playwright advises against caching browser
# binaries (restoring takes about as long as downloading), and the image makes
# the question moot. Keep the image tag equal to the Playwright version in
# pnpm-lock.yaml.
on:
  pull_request:
    paths:
      - 'packages/craft/**'
      - 'packages/sanity-copy/**'
      - 'packages/buyer-panel/**'
      - '.github/workflows/browser.yml'

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  craft-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Point craft at the image's Chromium
        working-directory: packages/craft
        shell: bash
        run: echo "CRAFT_CHROMIUM=$(node -e "import('playwright').then(p => console.log(p.chromium.executablePath()))")" >> "$GITHUB_ENV"

      # --reporter=verbose names each test. The job then requires the browser
      # tests to have passed by name: a skipped file prints no test lines at
      # all, so "nothing failed" would otherwise prove nothing. Colour is off
      # and any escape codes are stripped before counting, because vitest puts
      # them between the tick and the test name.
      - name: craft tests in a real browser
        working-directory: packages/craft
        shell: bash
        env:
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          set -o pipefail
          pnpm exec vitest run --reporter=verbose 2>&1 | tee vitest.log
          ran=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log | grep -c "✓ .*craft audit in a real browser" || true)
          if [ "$ran" -eq 0 ]; then
            echo "No browser test ran. CRAFT_CHROMIUM=$CRAFT_CHROMIUM" >&2
            exit 1
          fi
          echo "$ran browser tests passed"
          phone=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log | grep -c "✓ .*craft phone-first in a real browser" || true)
          if [ "$phone" -eq 0 ]; then
            echo "The phone-first browser test did not run." >&2
            exit 1
          fi
          viewports=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log | grep -c "✓ .*craft viewports in a real browser" || true)
          if [ "$viewports" -eq 0 ]; then
            echo "The every-viewport browser test did not run." >&2
            exit 1
          fi

      # buyer-panel reads the screen text in a real page. Same rule as above: the job requires the tests to have
      # passed by name, because a skipped file prints no test lines.
      - name: buyer-panel screen text in a real browser
        working-directory: packages/buyer-panel
        shell: bash
        env:
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          set -o pipefail
          pnpm exec vitest run --reporter=verbose 2>&1 | tee vitest.log
          ran=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log | grep -c "✓ .*screen text in a real browser" || true)
          if [ "$ran" -eq 0 ]; then
            echo "No buyer-panel browser test ran." >&2
            exit 1
          fi
          echo "$ran buyer-panel browser tests passed"
          taps=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log | grep -c "✓ .*taps and scrolls in a real browser" || true)
          if [ "$taps" -eq 0 ]; then
            echo "The buyer-panel tap and scroll tests did not run." >&2
            exit 1
          fi
